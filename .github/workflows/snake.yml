name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4

      # SVG Light (claro)
      - name: Generate Snake (light)
        uses: Platane/snk@v3
        with:
          github_user_name: Atered01
          outputs: dist/github-contribution-grid-snake.svg
          palette: '#fff,#eee,#ddd,#39d353,#0ca5e9,#000,#39d353,#39d353'

      # SVG Dark (escuro)
      - name: Generate Snake (dark)
        uses: Platane/snk@v3
        with:
          github_user_name: Atered01
          outputs: dist/github-contribution-grid-snake-dark.svg
          palette: '#0d1117,#161b22,#30363d,#39d353,#0ca5e9,#fff,#39d353,#39d353'

      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
